aid: motics-technologies
name: Motics Technologies
description: >-
  Motics Technologies (trading as Motics / Motics Health) is a UK-based
  healthcare AI automation platform providing AI agents for clinics, hospitals,
  and care homes. Its five agents — Scribe (clinical notes, letters, discharge
  summaries), Phone (24/7 AI receptionist and appointment booking), Email
  (patient communications and inbox triage), Billing (insurance claims and
  revenue cycle management), and Audit (clinic-wide documentation review for
  CQC/HCPC readiness) — help clinicians save 2+ hours per day on administrative
  work. Motics serves NHS trusts, private clinics, care homes, and telehealth
  providers, integrating with practice management systems including Cliniko,
  Meddbase, and Nookal, and states NHS Digital, HCPC, GMC, CQC, GDPR, and
  ISO 27001 compliance. The company is a Techstars portfolio company. No public
  developer API, SDK, or API reference is published at this time.
